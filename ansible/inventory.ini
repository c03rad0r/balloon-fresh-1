# Inventory for the KiCad workstation playbook.
#
# Default: the machine you run it on (inspection is usually local).
# Add remote inspection hosts under [kicad_hosts] and select with
#   ansible-playbook -i ansible/inventory.ini ansible/kicad-workstation.yml -e target=<name>
#
# NOTE: localhost is ALWAYS reachable — the playbook sets connection=local
# automatically when target == localhost, so no SSH is needed for local runs.

[kicad_hosts]
localhost ansible_connection=local

# Remote workstations / fleet nodes (uncomment + adjust):
# x280      ansible_host=x280     ansible_user=c08r4d0r
# cobrador  ansible_host=cobrador ansible_user=c03rad0r
