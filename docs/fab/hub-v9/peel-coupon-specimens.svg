<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1560" viewBox="0 0 1720 1560" font-family="DejaVu Sans, Helvetica, sans-serif">
<rect width="1720" height="1560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#b00020"/></marker><marker id="arU" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M1,10 L5,0 L9,10 z" fill="#b00020"/></marker></defs>
<text x="60" y="28" font-size="22" font-weight="bold">ADF-046 wing joint — peel coupon specimens</text>
<text x="90" y="90" font-size="20" font-weight="bold">SPECIMEN B — PEEL  (Option B's failure mode)</text>
<text x="90" y="116" font-size="14" fill="#444">0.6 mm FR4 coupon · ONE fillet along a single 1.2 mm edge · load at 2.0 mm from the root</text>
<rect x="140" y="330" width="552.0" height="27.599999999999998" fill="#2f6b3a" stroke="#1d4425" stroke-width="1.5"/>
<text x="140" y="379.6" font-size="13" fill="#2f6b3a">coupon substrate 0.6 mm FR4</text>
<rect x="508.0" y="274.8" width="184.0" height="55.199999999999996" fill="#c8751a" stroke="#8a4d0c" stroke-width="1.2"/>
<text x="502.0" y="266.8" font-size="13.5" fill="#8a4d0c" text-anchor="end">copper land</text>
<path d="M 508.0 274.8 q -20 55.199999999999996 0 55.199999999999996" fill="#e0a53a" stroke="#c8751a" stroke-width="2"/>
<text x="478.0" y="370" font-size="13" fill="#8a4d0c" text-anchor="end">fillet (1.2 mm long)</text>
<line x1="508.0" y1="401.6" x2="692.0" y2="401.6" stroke="#111" stroke-width="1.3"/>
<line x1="508.0" y1="394.6" x2="508.0" y2="408.6" stroke="#111" stroke-width="1.3"/>
<line x1="692.0" y1="394.6" x2="692.0" y2="408.6" stroke="#111" stroke-width="1.3"/>
<path d="M519.0,401.6 L508.0,397.1 L508.0,406.1 z" fill="#111"/>
<path d="M681.0,401.6 L692.0,397.1 L692.0,406.1 z" fill="#111"/>
<text x="600.0" y="390.6" font-size="14" fill="#111" text-anchor="middle">land 4.0 mm</text>
<line x1="508.0" y1="453.6" x2="508.0" y2="453.6" stroke="#111" stroke-width="1.3"/>
<line x1="508.0" y1="446.6" x2="508.0" y2="460.6" stroke="#111" stroke-width="1.3"/>
<line x1="508.0" y1="446.6" x2="508.0" y2="460.6" stroke="#111" stroke-width="1.3"/>
<path d="M519.0,453.6 L508.0,449.1 L508.0,458.1 z" fill="#111"/>
<path d="M497.0,453.6 L508.0,449.1 L508.0,458.1 z" fill="#111"/>
<text x="508.0" y="442.6" font-size="14" fill="#111" text-anchor="middle">load arm 2.0 mm</text>
<line x1="600.0" y1="144.8" x2="600.0" y2="258.8" stroke="#b00020" stroke-width="3.5" marker-end="url(#arU)"/>
<text x="614.0" y="150.8" font-size="15" font-weight="bold" fill="#b00020">F — pull AWAY from the substrate</text>
<text x="614.0" y="172.8" font-size="13" fill="#b00020">perpendicular to the board plane</text>
<text x="140" y="118.80000000000001" font-size="13" fill="#777">the fillet root is the pivot: the land sees a moment about one edge, so this tests PEEL, not pure tension.</text>
<text x="90" y="700" font-size="20" font-weight="bold">SPECIMEN A — SHEAR  (Option A's failure mode)</text>
<text x="90" y="726" font-size="14" fill="#444">0.6 mm tab soldered on BOTH faces into a 0.9 mm slot · pull along the insertion axis</text>
<rect x="200" y="800" width="138.0" height="460.0" fill="#2f6b3a" stroke="#1d4425" stroke-width="1.5"/>
<rect x="379.4" y="800" width="138.0" height="460.0" fill="#2f6b3a" stroke="#1d4425" stroke-width="1.5"/>
<text x="200" y="1282.0" font-size="13" fill="#2f6b3a">hub wall · slot 0.9 mm</text>
<rect x="344.9" y="800" width="27.599999999999998" height="276.0" fill="#dfe6ee" stroke="#33475b" stroke-width="2"/>
<text x="358.7" y="1106.0" font-size="13.5" fill="#33475b" text-anchor="middle">tab 0.6 mm thick, seated in the slot</text>
<path d="M 344.9 814 q -16 20 0 44" fill="#e0a53a" stroke="#c8751a" stroke-width="2"/>
<path d="M 372.5 814 q 16 20 0 44" fill="#e0a53a" stroke="#c8751a" stroke-width="2"/>
<line x1="314.9" y1="830" x2="336.9" y2="834" stroke="#8a4d0c" stroke-width="1"/>
<text x="310.9" y="828" font-size="13" fill="#8a4d0c" text-anchor="end">fillet — face 1</text>
<line x1="402.5" y1="830" x2="380.5" y2="834" stroke="#8a4d0c" stroke-width="1"/>
<text x="406.5" y="828" font-size="13" fill="#8a4d0c">fillet — face 2</text>
<line x1="200" y1="774" x2="344.9" y2="774" stroke="#111" stroke-width="1.3"/>
<line x1="200" y1="767" x2="200" y2="781" stroke="#111" stroke-width="1.3"/>
<line x1="344.9" y1="767" x2="344.9" y2="781" stroke="#111" stroke-width="1.3"/>
<path d="M211,774 L200,769.5 L200,778.5 z" fill="#111"/>
<path d="M333.9,774 L344.9,769.5 L344.9,778.5 z" fill="#111"/>
<text x="272.45" y="763" font-size="14" fill="#111" text-anchor="middle">slot 0.9 mm</text>
<line x1="358.7" y1="1172.0" x2="358.7" y2="1092.0" stroke="#b00020" stroke-width="3.5" marker-end="url(#arU)"/>
<text x="372.7" y="1178.0" font-size="15" font-weight="bold" fill="#b00020">F — pull ALONG the insertion axis</text>
<text x="372.7" y="1200.0" font-size="13" fill="#b00020">shear — BOTH fillets loaded in-plane</text>
<text x="200" y="704" font-size="13" fill="#777">the slot prevents rotation about an edge: the fillet area carries the load in SHEAR, which is the whole reason Option A out-performs a face joint.</text>
<text x="60" y="1290" font-size="17" font-weight="bold">What the two specimens decide</text>
<text x="60" y="1316" font-size="14" font-weight="bold">measured</text>
<text x="200" y="1316" font-size="14" fill="#333">peak force at failure, in N, per specimen</text>
<text x="60" y="1342" font-size="14" font-weight="bold">samples</text>
<text x="200" y="1342" font-size="14" fill="#333">n >= 5 per condition</text>
<text x="60" y="1368" font-size="14" font-weight="bold">derived</text>
<text x="200" y="1368" font-size="14" fill="#333">knockdown_B = (pure tensile strength of the same fillet) / (measured peel strength)</text>
<text x="60" y="1394" font-size="14" font-weight="bold">then</text>
<text x="200" y="1394" font-size="14" fill="#333">feed knockdown_B into trade_study_wing_joint.py's peel_knockdown input and re-run</text>
<text x="60" y="1420" font-size="14" font-weight="bold">rule</text>
<text x="200" y="1420" font-size="14" fill="#333">~4x -> Option B margin 7.8x (comfortable);  below 1.2x -> Option B approaches Option A</text>
<text x="60" y="1446" font-size="14" font-weight="bold">variants</text>
<text x="200" y="1446" font-size="14" fill="#333">as-soldered · cold-soak (wing sees -40 C) · a deliberately weak fillet · the build's own alloy</text>
<text x="60" y="1546" font-size="12" fill="#777">dimensions from tracker/hardware/trade_study_wing_joint.py and peel_coupon_design.py (same constants) · generated by draw_peel_coupon.py</text>
</svg>