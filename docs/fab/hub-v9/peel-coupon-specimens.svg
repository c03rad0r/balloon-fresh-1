<text x="60" y="706" font-size="20" fill="#111" font-weight="bold">SPECIMEN A — SHEAR  (Option A's failure mode)</text>
<text x="60" y="730" font-size="13.5" fill="#444">0.6 mm tab soldered on BOTH faces into a 0.9 mm slot · pull along the insertion axis · SECTION, ~1.6:1</text>
<text x="58" y="772" font-size="13" fill="#8a4d0c">7  FILLET — face 1: solder in the 0.15 mm gap, 6.0 mm long</text>
<text x="58" y="798" font-size="13" fill="#8a4d0c">8  FILLET — face 2: the same on the tab's other face</text>
<text x="58" y="824" font-size="13" fill="#33475b">9  TAB — 0.6 mm thick, seated 6.0 mm into the slot</text>
<text x="58" y="850" font-size="13" fill="#2f6b3a">10  HUB MATERIAL — the slot's walls (lateral extent not to scale)</text>
<text x="58" y="880" font-size="12.5" fill="#666">the slot's walls resist rotation about an edge, so both fillets load</text>
<text x="58" y="898" font-size="12.5" fill="#666">mainly in SHEAR — the loading this coupon is meant to confirm, and the</text>
<text x="58" y="916" font-size="12.5" fill="#666">reason Option A is expected to out-perform a face joint. The hub is the fixed</text>
<text x="58" y="934" font-size="12.5" fill="#666">member (hatched); only the tab is pulled.</text>
<text x="700" y="758" font-size="15" fill="#b00020" font-weight="bold">F — pull ALONG the insertion axis</text>
<text x="700" y="782" font-size="13" fill="#b00020">out of the slot; shear — BOTH fillets loaded in-plane</text>
