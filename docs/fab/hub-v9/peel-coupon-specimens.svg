<text x="60" y="36" font-size="22" font-weight="bold">ADF-046 wing joint — peel coupon specimens</text>
<text x="60" y="62" font-size="12.5" fill="#666">Sheet scope: PEEL specimen B (B1/B2) and SHEAR specimen A; the pure-tension reference coupon is a separate work-order item (see PEEL-COUPON.md).</text>
<text x="60" y="92" font-size="20" fill="#111" font-weight="bold">SPECIMEN B — PEEL  (Option B's failure mode)</text>
<text x="60" y="116" font-size="13.5" fill="#444">0.6 mm FR4 coupon · ONE fillet along a single 1.2 mm edge · load applied 2.0 mm from the fillet root · two views (B1 plan, B2 section)</text>
<rect x="42" y="150" width="606" height="470" fill="#f6f8f6" stroke="#cfd8cf"/>
