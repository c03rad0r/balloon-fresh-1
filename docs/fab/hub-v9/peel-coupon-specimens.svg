<text x="58" y="214" font-size="13" fill="#8a4d0c">1  COPPER LAND — 4.0 × 1.2 mm, the loaded member</text>
<text x="58" y="240" font-size="13" fill="#8a4d0c">2  FILLET (solder) — the peel root, along this 1.2 mm edge</text>
<text x="58" y="266" font-size="13" fill="#b00020">3  LOAD ⊙ — F is out of the page, 2.0 mm from the fillet root</text>
<text x="58" y="292" font-size="13" fill="#8a4d0c">11  the coupon's own solderable pad — the stationary member (see B2)</text>
<text x="58" y="318" font-size="12.5" fill="#2f6b3a">coupon = the stationary member; the fixture holds its left end</text>
