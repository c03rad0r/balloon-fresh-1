<text x="58" y="596" font-size="12.5" fill="#666">coupon offcut — FR4, 0.6 mm thick. The land's 4.0 mm runs along the</text>
<text x="58" y="614" font-size="12.5" fill="#666">insertion axis; the fillet edge and the load line both run across its 1.2 mm</text>
<rect x="672" y="150" width="606" height="470" fill="#fdf7f0" stroke="#e6d6c4"/>
<text x="688" y="182" font-size="14" fill="#111" font-weight="bold">B2 — SECTION along the insertion axis, through the load line</text>
<text x="688" y="214" font-size="13" fill="#b00020" font-weight="bold">F — pull AWAY from the substrate, perpendicular to the board</text>
<text x="688" y="240" font-size="13" fill="#b00020">applied 2.0 mm from the fillet root, 0.340 N per land at the coupon's 10 g shock</text>
<text x="688" y="268" font-size="13" fill="#8a4d0c">4  COPPER LAND in section (thickness drawn exaggerated)</text>
<text x="688" y="294" font-size="13" fill="#8a4d0c">5  FILLET (solder) — the peel root, the pivot</text>
<text x="688" y="320" font-size="13" fill="#2f6b3a">6  COUPON SUBSTRATE — FR4, 0.6 mm, held fixed at its left end.</text>
<text x="688" y="344" font-size="13" fill="#2f6b3a">     The land is held along one 1.2 mm edge only, so it sees a</text>
<text x="688" y="366" font-size="13" fill="#2f6b3a">     MOMENT about that edge: PEEL, not pure tension.</text>
<text x="688" y="392" font-size="13" fill="#8a4d0c">11  the coupon's own solderable pad — the stationary</text>
<text x="688" y="412" font-size="13" fill="#8a4d0c">      mating member the root fillet wets. The land is</text>
<text x="688" y="432" font-size="13" fill="#8a4d0c">      bonded along THIS edge only.</text>
