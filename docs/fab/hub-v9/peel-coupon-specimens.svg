<text x="60" y="1660" font-size="17" fill="#111" font-weight="bold">What the two specimens decide</text>
<text x="60" y="1688" font-size="14" fill="#111" font-weight="bold">measured</text>
<text x="200" y="1688" font-size="14" fill="#333">peak force at failure, in N, per specimen</text>
<text x="60" y="1714" font-size="14" fill="#111" font-weight="bold">samples</text>
<text x="200" y="1714" font-size="14" fill="#333">n &gt;= 5 per condition</text>
<text x="60" y="1740" font-size="14" fill="#111" font-weight="bold">derived</text>
<text x="200" y="1740" font-size="14" fill="#333">knockdown_B = (strength of the same fillet in pure tension) / (measured peel strength)</text>
<text x="60" y="1766" font-size="14" fill="#111" font-weight="bold">reference</text>
<text x="200" y="1766" font-size="14" fill="#333">knockdown_B's numerator is a THIRD coupon, defined in PEEL-COUPON.md and not drawn on this sheet</text>
<text x="60" y="1792" font-size="14" fill="#111" font-weight="bold">then</text>
<text x="200" y="1792" font-size="14" fill="#333">feed knockdown_B into trade_study_wing_joint.py's peel_knockdown input and re-run</text>
<text x="60" y="1818" font-size="14" fill="#111" font-weight="bold">rule</text>
<text x="200" y="1818" font-size="14" fill="#333">~4x -&gt; Option B margin 7.8x (comfortable);  below 1.2x -&gt; Option B approaches Option A</text>
<text x="60" y="1844" font-size="14" fill="#111" font-weight="bold">variants</text>
<text x="200" y="1844" font-size="14" fill="#333">as-soldered · cold-soak (the wing sees −40 °C) · deliberately weak fillet · the build's alloy</text>
<text x="60" y="1870" font-size="14" fill="#111" font-weight="bold">fillet size</text>
<text x="200" y="1870" font-size="14" fill="#333">NOT specified here: fillet leg length is the technique variable the coupon measures — record each specimen's fillet profile</text>
<text x="60" y="1886" font-size="12" fill="#666">dimensions from tracker/hardware/trade_study_wing_joint.py and peel_coupon_design.py (same constants) · drawn by draw_peel_coupon.py</text>
