<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1180" viewBox="0 0 1560 1180" font-family="DejaVu Sans, Helvetica, sans-serif">
<rect width="1560" height="1180" fill="#ffffff"/>
<text x="60" y="62" font-size="27" font-weight="bold">Edge-launch wing socket — hub_board_v9, J_W1…J_W4</text>
<text x="60" y="92" font-size="15" fill="#444">Interface for JLCPCB fabrication review · dimensions in mm · copper deliberately terminates at the routed edge</text>
<text x="60" y="132" font-size="19" font-weight="bold">VIEW A — cross-section through the contact row</text>
<rect x="90" y="250" width="380" height="90" fill="#2f6b3a" stroke="#1d4425" stroke-width="1.5"/>
<line x1="90" y1="272.5" x2="470" y2="272.5" stroke="#1d4425" stroke-width="0.8" opacity="0.55"/>
<line x1="90" y1="295.0" x2="470" y2="295.0" stroke="#1d4425" stroke-width="0.8" opacity="0.55"/>
<line x1="90" y1="317.5" x2="470" y2="317.5" stroke="#1d4425" stroke-width="0.8" opacity="0.55"/>
<text x="102" y="302" font-size="14" fill="#ffffff">0.6 mm FR4, 4 layer</text>
<rect x="240" y="239" width="230" height="11" fill="#c8751a" stroke="#8a4d0c" stroke-width="1.2"/>
<line x1="470" y1="210" x2="470" y2="380" stroke="#b00020" stroke-width="3" stroke-dasharray="10,5"/>
<rect x="496" y="250" width="204" height="90" fill="#dfe6ee" stroke="#5a6b7d" stroke-width="1.5"/>
<rect x="496" y="250" width="204" height="6" fill="#c8751a" stroke="#8a4d0c" stroke-width="0.9"/>
<text x="240" y="146" font-size="14" fill="#8a4d0c">exposed copper pad (F.Cu) — solderable</text>
<text x="500" y="146" font-size="14" fill="#33475b">mating wing tab — 0.6 mm FR4, copper facing the board</text>
<path d="M 470 239 L 496 239 L 496 272 Q 476 266 470 241 Z" fill="#e0a53a" stroke="#c8751a" stroke-width="1.6"/>
<text x="506" y="266" font-size="13" fill="#8a4d0c">solder fillet — wets pad and tab</text>
<line x1="470" y1="100" x2="496" y2="100" stroke="#33475b" stroke-width="1.3"/>
<line x1="470" y1="92" x2="470" y2="108" stroke="#33475b" stroke-width="1.3"/>
<line x1="496" y1="92" x2="496" y2="108" stroke="#33475b" stroke-width="1.3"/>
<path d="M458,100 L470,95.5 L470,104.5 z" fill="#33475b"/>
<path d="M508,100 L496,95.5 L496,104.5 z" fill="#33475b"/>
<text x="483.0" y="90" font-size="13.5" fill="#33475b" text-anchor="middle">0.30 mm</text>
<line x1="483.0" y1="108" x2="483.0" y2="190" stroke="#33475b" stroke-width="0.9" stroke-dasharray="3,3"/>
<text x="510" y="82" font-size="12.5" fill="#33475b">slot 0.9 mm minus tab 0.6 mm = 0.30 mm</text>
<line x1="240" y1="370" x2="470" y2="370" stroke="#111" stroke-width="1.3"/>
<line x1="240" y1="362" x2="240" y2="378" stroke="#111" stroke-width="1.3"/>
<line x1="470" y1="362" x2="470" y2="378" stroke="#111" stroke-width="1.3"/>
<path d="M252,370 L240,365.5 L240,374.5 z" fill="#111"/>
<path d="M458,370 L470,365.5 L470,374.5 z" fill="#111"/>
<text x="355.0" y="390" font-size="13.5" fill="#111" text-anchor="middle">pad 4.0 mm</text>
<line x1="130" y1="426" x2="470" y2="426" stroke="#33475b" stroke-width="1.3"/>
<line x1="130" y1="418" x2="130" y2="434" stroke="#33475b" stroke-width="1.3"/>
<line x1="470" y1="418" x2="470" y2="434" stroke="#33475b" stroke-width="1.3"/>
<path d="M142,426 L130,421.5 L130,430.5 z" fill="#33475b"/>
<path d="M458,426 L470,421.5 L470,430.5 z" fill="#33475b"/>
<text x="300.0" y="446" font-size="13.5" fill="#33475b" text-anchor="middle">insertion depth 6.0 mm (tab seated into the slot)</text>
<path d="M 700 210 L 526 210" stroke="#33475b" stroke-width="2" marker-end="url(#ah)"/>
<text x="532" y="204" font-size="13" fill="#33475b">tab travels toward the board</text>
<text x="790" y="132" font-size="19" font-weight="bold">VIEW B — connector row, viewed from the component side</text>
<rect x="790" y="150" width="250" height="150" fill="#2f6b3a" stroke="#1d4425" stroke-width="1.5"/>
<line x1="1040" y1="150" x2="1040" y2="300" stroke="#b00020" stroke-width="2.6" stroke-dasharray="10,5"/>
<text x="1046" y="230" font-size="13.5" fill="#b00020" font-weight="bold">routed edge</text>
<rect x="940" y="164" width="100" height="26" fill="#c8751a" stroke="#8a4d0c" stroke-width="1.1"/>
<text x="932" y="182" font-size="12.5" text-anchor="end">1</text>
<rect x="940" y="197" width="100" height="26" fill="#c8751a" stroke="#8a4d0c" stroke-width="1.1"/>
<text x="932" y="215" font-size="12.5" text-anchor="end">2</text>
<rect x="940" y="230" width="100" height="26" fill="#c8751a" stroke="#8a4d0c" stroke-width="1.1"/>
<text x="932" y="248" font-size="12.5" text-anchor="end">3</text>
<rect x="940" y="263" width="100" height="26" fill="#c8751a" stroke="#8a4d0c" stroke-width="1.1"/>
<text x="932" y="281" font-size="12.5" text-anchor="end">4</text>
<line x1="940" y1="340" x2="1040" y2="340" stroke="#111" stroke-width="1.3"/>
<text x="990" y="334" font-size="13" text-anchor="middle">4.0 mm (insertion axis)</text>
<text x="790" y="364" font-size="13">pad 1.2 mm wide · pitch 1.8 mm · 0.6 mm between pad edges</text>
<text x="790" y="392" font-size="13" fill="#b00020">the edge cut runs along the pad ends — copper is cut flush, this is the contact</text>
<text x="790" y="412" font-size="13" fill="#b00020">surface. each pad is exposed copper, NOT a castellated hole.</text>
<text x="60" y="620" font-size="18" font-weight="bold">Requirements</text>
<line x1="60" y1="630" x2="1500" y2="630" stroke="#ccc" stroke-width="1.2"/>
<line x1="60" y1="672" x2="1500" y2="672" stroke="#eee" stroke-width="1"/>
<text x="64" y="664" font-size="14" font-weight="bold">Solder mask</text>
<text x="360" y="664" font-size="14" fill="#333">opening ends BEFORE the routed edge; the pad itself is unmasked</text>
<line x1="60" y1="706" x2="1500" y2="706" stroke="#eee" stroke-width="1"/>
<text x="64" y="698" font-size="14" font-weight="bold">Surface finish</text>
<text x="360" y="698" font-size="14" fill="#333">ENIG preferred (flat, solderable after assembly); HASBL/HASL acceptable</text>
<line x1="60" y1="740" x2="1500" y2="740" stroke="#eee" stroke-width="1"/>
<text x="64" y="732" font-size="14" font-weight="bold">Copper to edge</text>
<text x="360" y="732" font-size="14" fill="#333">0.00 mm — INTENTIONAL. This is the electrical contact surface.</text>
<line x1="60" y1="774" x2="1500" y2="774" stroke="#eee" stroke-width="1"/>
<text x="64" y="766" font-size="14" font-weight="bold">NOT wanted</text>
<text x="360" y="766" font-size="14" fill="#333">no castellation, no edge plating. Plain exposed copper at a plain cut.</text>
<line x1="60" y1="808" x2="1500" y2="808" stroke="#eee" stroke-width="1"/>
<text x="64" y="800" font-size="14" font-weight="bold">Edge positional tolerance</text>
<text x="360" y="800" font-size="14" fill="#333">routed edge vs copper — PLEASE ADVISE your capability</text>
<line x1="60" y1="842" x2="1500" y2="842" stroke="#eee" stroke-width="1"/>
<text x="64" y="834" font-size="14" font-weight="bold">Panel tabs</text>
<text x="360" y="834" font-size="14" fill="#333">keep clear of these edges; they are mating surfaces</text>
<line x1="60" y1="876" x2="1500" y2="876" stroke="#eee" stroke-width="1"/>
<text x="64" y="868" font-size="14" font-weight="bold">Burrs / peeling</text>
<text x="360" y="868" font-size="14" fill="#333">please advise mitigation if the process produces them at the cut</text>
<defs><marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L10,5 L0,9 z" fill="#33475b"/></marker></defs>
<text x="60" y="1164" font-size="12" fill="#777">geometry measured from tracker/hardware/hub_board_v9.kicad_pcb; interface per docs/adr/046-wing-board-interface.md</text>
</svg>