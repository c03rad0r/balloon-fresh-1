<text x="80" y="522" font-family="monospace" font-size="8.5" fill="#c62828" text-anchor="start" font-weight="normal">series ⇒ one cut wing opens the string unless D_BP is fitted</text>
<text x="80" y="534" font-family="monospace" font-size="8.5" fill="#c62828" text-anchor="start" font-weight="bold">ADR-054 §2.2: without it the first cut = 0.00 W (100 % loss)</text>
<rect x="60" y="560" width="1170" height="96" fill="#fff8e1" stroke="#b8860b" stroke-width="1.6" rx="4"/>
<text x="76" y="582" font-family="monospace" font-size="12" fill="#b8860b" text-anchor="start" font-weight="bold">WHY THERE IS NO WING BOARD</text>
<text x="76" y="602" font-family="monospace" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">• ADR-117 (operator-accepted 2026-10-15): the airframe is a bought foam sheet, not FR4 — "remove the circuit board from the equation".</text>
<text x="76" y="616" font-family="monospace" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">• ADR-130: the wing is foam + cells. wing_board_v9.kicad_pcb is FROZEN HISTORY, not the wing. Its cells lie on copper because v9 WAS a board.</text>
<text x="76" y="630" font-family="monospace" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">• ADR-131: the 4-pin row is RETAINED unchanged (the hub is routed against it); what changed is only what supplies the mechanical normal force — a carried insert.</text>
<text x="76" y="644" font-family="monospace" font-size="8.8" fill="#1a1a1a" text-anchor="start" font-weight="normal">• ADR-052: cells are END-MOUNTED, never bonded to a face. The insert carries the JOINT, never a cell.</text>
</svg>