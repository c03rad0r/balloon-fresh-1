[platformio]
default_envs = rp2040-bridge

[env:rp2040-bridge]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<*> -<.git/>
build_flags =
    -D E80_HOST_RP2040
    -D E80_SPI_HZ=4000000UL
    -I src
    -I ../../../../firmware/e80-bypass/common
    -O2
    -Wall
lib_deps =
upload_protocol = picotool
monitor_speed = 115200
