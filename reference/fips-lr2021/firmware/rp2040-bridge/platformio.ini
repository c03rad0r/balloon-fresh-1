[platformio]
default_envs = rp2040-bridge

[env:rp2040-bridge]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<*> -<.git/>
build_flags =
    -D E80_HOST_RP2040
    -D E80_SPI_HZ=4000000UL
    -I src
    -I ../../../../firmware/e80-bypass/common
    -O2
    -Wall
lib_deps =
upload_protocol = picotool
monitor_speed = 115200

; Dual-RP2040 carrier with GPS + LR2021.
; GP12/GP13 are the GPS UART there, so the Serial1 log is compiled out.
; 20 MHz SPI matches the settings the carrier's own sweep firmware proved.
[env:rp2040-bridge-gpsboard]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<*> -<.git/>
build_flags =
    -D E80_HOST_RP2040
    -D E80_SPI_HZ=20000000UL
    -D E80_BRIDGE_UART_LOG=0
    -D E80_RADIO_IRQ_DIO=9
    -D E80_RFREQ_FRF=0
    -D E80_PKT_BYTE0=0x1E
    -D E80_PKT_BYTE1=0x7D
    -D E80_MOD_BYTE1=0x17
    -D E80_BRIDGE_POLL_IRQ=1
    -D E80_BRIDGE_CARRIER_INIT=1
    -I src
    -I ../../../../firmware/e80-bypass/common
    -O2
    -Wall
lib_deps =
upload_protocol = picotool
monitor_speed = 115200

; Same as rp2040-bridge-gpsboard but with the plain 4-byte Hz frequency form
; instead of FRF. Kept as an A/B for modules whose frequency encoding is
; uncertain: build both, flash one, test, then the other.
[env:rp2040-bridge-gpsboard-e80]
; Same GPS-carrier pins as gpsboard, but the E80 vendor bring-up path. Used as
; the independent second node for the ESP32-S3/E80 SPI-bypass interop test.
extends = env:rp2040-bridge-gpsboard
build_flags =
    -D E80_HOST_RP2040
    -D E80_SPI_HZ=20000000UL
    -D E80_BRIDGE_UART_LOG=0
    -D E80_RADIO_IRQ_DIO=9
    -D E80_RFREQ_FRF=0
    -D E80_PKT_BYTE0=0x1E
    -D E80_PKT_BYTE1=0x7D
    -D E80_MOD_BYTE1=0x17
    -D E80_BRIDGE_POLL_IRQ=1
    -D E80_BRIDGE_CARRIER_INIT=0
    -I src
    -I ../../../../firmware/e80-bypass/common
    -O2
    -Wall

[env:rp2040-bridge-gpsboard-hz]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
build_src_filter = +<*> -<.git/>
build_flags =
    -D E80_HOST_RP2040
    -D E80_SPI_HZ=20000000UL
    -D E80_BRIDGE_UART_LOG=0
    -D E80_RADIO_IRQ_DIO=9
    -D E80_RFREQ_FRF=0
    -D E80_BRIDGE_POLL_IRQ=1
    -D E80_BRIDGE_CARRIER_INIT=1
    -I src
    -I ../../../../firmware/e80-bypass/common
    -O2
    -Wall
lib_deps =
upload_protocol = picotool
monitor_speed = 115200
